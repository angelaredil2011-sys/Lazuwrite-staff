<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LazuWrite - Team Coordination & Calendar</title>
    <!-- Supabase JavaScript SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #030712; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 12px; }
        
        .auth-container { width: 100%; min-height: 90vh; display: flex; align-items: center; justify-content: center; }
        .card { background-color: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 24px; width: 100%; max-width: 380px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        h1 { font-size: 24px; font-weight: bold; text-align: center; background: linear-gradient(to right, #60a5fa, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
        p.subtitle { text-align: center; color: #9ca3af; font-size: 12px; margin-bottom: 20px; }
        .tabs { display: flex; background: #030712; padding: 4px; border-radius: 10px; border: 1px solid #1f2937; margin-bottom: 18px; }
        .tab-btn { flex: 1; padding: 8px; font-size: 12px; font-weight: 600; border: none; background: transparent; color: #9ca3af; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .tab-btn.active { background: #2563eb; color: #ffffff; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 10px; font-weight: 600; text-transform: uppercase; color: #9ca3af; margin-bottom: 4px; }
        input, select, textarea { width: 100%; background: #030712; border: 1px solid #1f2937; border-radius: 8px; padding: 10px; color: #f3f4f6; font-size: 13px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #3b82f6; }
        button.submit-btn { width: 100%; background: #2563eb; color: #ffffff; font-weight: 600; padding: 11px; border: none; border-radius: 8px; cursor: pointer; margin-top: 4px; font-size: 13px; }
        button.submit-btn:hover { background: #1d4ed8; }

        .dashboard { width: 100%; max-width: 1300px; flex: 1; display: flex; flex-direction: column; margin: 0 auto; }
        header { background: #111827; border: 1px solid #1f2937; padding: 14px 18px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
        .nav-links { display: flex; gap: 8px; }
        .nav-link { background: #1f2937; color: #d1d5db; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 600; }
        .nav-link.active { background: #2563eb; color: #fff; }
        .logout-btn { background: #1f2937; color: #f87171; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 11px; }
        .logout-btn:hover { background: #7f1d1d; color: #fff; }
        
        .grid { display: grid; grid-template-columns: 1fr; gap: 16px; width: 100%; }
        @media(min-width: 900px) { .grid { grid-template-columns: 2fr 1fr; } }

        .panel { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .panel h2 { font-size: 15px; font-weight: bold; margin-bottom: 12px; color: #e5e7eb; }
        
        .roster-item { background: #030712; border: 1px solid #1f2937; padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
        .role-tag { display: inline-flex; align-items: center; background: #1f2937; color: #d1d5db; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-right: 4px; }
        .role-tag button { background: none; border: none; color: #f87171; font-weight: bold; margin-left: 4px; cursor: pointer; font-size: 12px; }
        
        .badge-red { background: #450a0a; color: #f87171; border: 1px solid #7f1d1d; padding: 2px 6px; border-radius: 99px; font-size: 9px; font-weight: 600; }
        .badge-amber { background: #451a03; color: #fbbf24; border: 1px solid #78350f; padding: 2px 6px; border-radius: 99px; font-size: 9px; font-weight: 600; }
        .badge-blue { background: #172554; color: #93c5fd; border: 1px solid #1e40af; padding: 2px 6px; border-radius: 99px; font-size: 9px; font-weight: 600; }
        .badge-type { background: #1e1b4b; color: #c7d2fe; border: 1px solid #312e81; padding: 2px 6px; border-radius: 99px; font-size: 9px; font-weight: 600; }
        .badge-status-approved { background: #064e3b; color: #34d399; border: 1px solid #047857; padding: 2px 6px; border-radius: 99px; font-size: 9px; font-weight: 600; }
        .badge-status-revision { background: #7c2d12; color: #fb923c; border: 1px solid #c2410c; padding: 2px 6px; border-radius: 99px; font-size: 9px; font-weight: 600; }
        .badge-status-smm { background: #1e3a8a; color: #93c5fd; border: 1px solid #1d4ed8; padding: 2px 6px; border-radius: 99px; font-size: 9px; font-weight: 600; }

        .action-btn { background: #1f2937; color: #9ca3af; border: none; padding: 5px 8px; border-radius: 6px; font-size: 10px; cursor: pointer; font-weight: 600; }
        .action-btn:hover { background: #374151; color: #fff; }
        .action-btn.del:hover { background: #7f1d1d; color: #fca5a5; }
        .action-btn.approve { background: #047857; color: #fff; }
        .action-btn.approve:hover { background: #059669; }
        .action-btn.revision { background: #c2410c; color: #fff; }
        .action-btn.revision:hover { background: #ea580c; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
        .cal-header { font-size: 10px; font-weight: 600; color: #6b7280; padding-bottom: 4px; }
        .cal-cell { background: #030712; border: 1px solid #1f2937; border-radius: 6px; min-height: 60px; padding: 3px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; }
        .cal-day-num { font-size: 10px; font-weight: bold; color: #9ca3af; }
    </style>
</head>
<body>

    <div id="app" style="width: 100%;"></div>

    <script>
        const SUPABASE_URL = 'https://ulmwwuvvioihhosyfflp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_pM7zmfoy7UHnwAY6Wii7mQ_zBBObH-V';
        let supabaseClient = null;

        try {
            if (window.supabase) {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error('Supabase init error:', e);
        }

        let state = {
            currentUser: null,
            users: JSON.parse(localStorage.getItem('lazu_users') || '[]'),
            tasks: JSON.parse(localStorage.getItem('lazu_tasks') || '[]'),
            authTab: 'login',
            currentMonth: new Date().getMonth(),
            currentYear: new Date().getFullYear(),
            editingTaskId: null,
            currentView: 'dashboard'
        };

        const ROLES = [
            'Social Media Manager',
            'Chief Caption Writer',
            'Chief PubMat Artist',
            'Chief Text Formatter',
            'Caption Writer',
            'PubMat Artist',
            'Text Formatter'
        ];

        const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        async function init() {
            try {
                const saved = sessionStorage.getItem('lazu_session');
                if (saved) state.currentUser = JSON.parse(saved);
            } catch (e) {
                sessionStorage.removeItem('lazu_session');
            }

            render();

            if (supabaseClient) {
                await fetchAppData();
                setupRealtimeSync();
            }

            setInterval(render, 60000);
        }

        async function fetchAppData() {
            if (!supabaseClient) return;
            try {
                const { data } = await supabaseClient
                    .from('app_state')
                    .select('*')
                    .eq('id', 1)
                    .single();

                if (data && data.payload) {
                    state.users = (data.payload.users || []).map(u => ({
                        ...u,
                        roles: u.roles || [u.role || 'Caption Writer']
                    }));
                    state.tasks = data.payload.tasks || [];
                    
                    localStorage.setItem('lazu_users', JSON.stringify(state.users));
                    localStorage.setItem('lazu_tasks', JSON.stringify(state.tasks));

                    if (state.currentUser) {
                        const upToDateUser = state.users.find(u => u.username === state.currentUser.username);
                        if (upToDateUser) {
                            state.currentUser = upToDateUser;
                            sessionStorage.setItem('lazu_session', JSON.stringify(upToDateUser));
                        } else {
                            handleLogout();
                        }
                    }
                    render();
                }
            } catch (err) {
                console.error('Background fetch notice:', err);
            }
        }

        async function saveAppData() {
            localStorage.setItem('lazu_users', JSON.stringify(state.users));
            localStorage.setItem('lazu_tasks', JSON.stringify(state.tasks));

            if (!supabaseClient) return;
            try {
                const payload = {
                    users: state.users,
                    tasks: state.tasks
                };
                await supabaseClient.from('app_state').upsert({ id: 1, payload: payload });
            } catch (err) {
                console.error('Supabase save error:', err);
            }
        }

        function setupRealtimeSync() {
            if (!supabaseClient) return;
            try {
                supabaseClient
                    .channel('public:app_state')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'app_state' }, payload => {
                        if (payload.new && payload.new.payload) {
                            state.users = (payload.new.payload.users || []).map(u => ({
                                ...u,
                                roles: u.roles || [u.role || 'Caption Writer']
                            }));
                            state.tasks = payload.new.payload.tasks || [];
                            
                            localStorage.setItem('lazu_users', JSON.stringify(state.users));
                            localStorage.setItem('lazu_tasks', JSON.stringify(state.tasks));

                            if (state.currentUser) {
                                const upToDateUser = state.users.find(u => u.username === state.currentUser.username);
                                if (upToDateUser) {
                                    state.currentUser = upToDateUser;
                                    sessionStorage.setItem('lazu_session', JSON.stringify(upToDateUser));
                                } else {
                                    handleLogout();
                                }
                            }
                            render();
                        }
                    })
                    .subscribe();
            } catch (err) {
                console.error('Realtime error:', err);
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            if (supabaseClient) await fetchAppData();

            const user = state.users.find(u => u.username.toLowerCase() === username.toLowerCase());
            if (!user) { alert('Username not found! Please register first.'); return; }
            if (user.password !== password) { alert('Incorrect password!'); return; }

            state.currentUser = user;
            sessionStorage.setItem('lazu_session', JSON.stringify(user));
            render();
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value;

            if (supabaseClient) await fetchAppData();

            if (state.users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
                alert('Username already exists!'); return;
            }

            const isFirst = state.users.length === 0;
            const newUser = {
                id: Date.now(),
                username,
                password,
                roles: [isFirst ? 'Social Media Manager' : 'Caption Writer']
            };

            state.users.push(newUser);
            state.currentUser = newUser;
            sessionStorage.setItem('lazu_session', JSON.stringify(newUser));
            await saveAppData();
            render();
        }

        function handleLogout() {
            state.currentUser = null;
            state.editingTaskId = null;
            state.currentView = 'dashboard';
            sessionStorage.removeItem('lazu_session');
            render();
        }

        function switchTab(tab) {
            state.authTab = tab;
            render();
        }

        function setView(view) {
            state.currentView = view;
            render();
        }

        async function handleTaskSubmit(e) {
            e.preventDefault();
            const isSMM = state.currentUser.roles && state.currentUser.roles.includes('Social Media Manager');
            if (!isSMM) {
                alert('Permission denied: Only the Social Media Manager can set deadlines.');
                return;
            }

            const title = document.getElementById('task-title').value.trim();
            const taskType = document.getElementById('task-type').value;
            const instructions = document.getElementById('task-instructions').value.trim();
            const deadline = document.getElementById('task-deadline').value;

            if (!title || !deadline) return;

            if (state.editingTaskId) {
                const task = state.tasks.find(t => t.id === state.editingTaskId);
                if (task) {
                    task.title = title;
                    task.taskType = taskType;
                    task.instructions = instructions;
                    task.deadline = deadline;
                }
                state.editingTaskId = null;
            } else {
                state.tasks.push({ 
                    id: Date.now(), 
                    title, 
                    taskType,
                    instructions,
                    assignee: 'Unassigned', 
                    deadline, 
                    status: 'Pending',
                    submission: '',
                    reviewStatus: 'Pending Assignment' 
                });
            }

            await saveAppData();
            render();
        }

        async function assignTaskMember(taskId) {
            const assignee = document.getElementById(`assignee-select-${taskId}`).value;
            const task = state.tasks.find(t => t.id === taskId);
            if (task) {
                task.assignee = assignee;
                task.reviewStatus = 'Pending Review';
                await saveAppData();
                alert(`Task successfully assigned to ${assignee}!`);
                render();
            }
        }

        function startEditTask(taskId) {
            const isSMM = state.currentUser.roles && state.currentUser.roles.includes('Social Media Manager');
            if (!isSMM) {
                alert('Permission denied: Only the Social Media Manager can edit schedules.');
                return;
            }
            state.editingTaskId = taskId;
            render();
        }

        function cancelEdit() {
            state.editingTaskId = null;
            render();
        }

        async function deleteTask(taskId) {
            const isSMM = state.currentUser.roles && state.currentUser.roles.includes('Social Media Manager');
            if (!isSMM) {
                alert('Permission denied: Only the Social Media Manager can delete schedules.');
                return;
            }

            if (!confirm('Are you sure you want to delete this schedule?')) return;

            state.tasks = state.tasks.filter(t => t.id !== taskId);
            if (state.editingTaskId === taskId) state.editingTaskId = null;
            await saveAppData();
            render();
        }

        async function updateTaskStatus(taskId, status) {
            const task = state.tasks.find(t => t.id === taskId);
            if (task) {
                task.status = status;
                await saveAppData();
                render();
            }
        }

        async function submitTaskWork(taskId) {
            const submissionText = document.getElementById(`sub-text-${taskId}`).value.trim();
            const task = state.tasks.find(t => t.id === taskId);
            if (task) {
                task.submission = submissionText;
                task.status = 'In Progress';
                task.reviewStatus = 'Pending Review';
                await saveAppData();
                alert('Work submitted for review!');
                render();
            }
        }

        async function reviewTask(taskId, verdict) {
            const task = state.tasks.find(t => t.id === taskId);
            if (!task) return;

            const isSMM = state.currentUser.roles && state.currentUser.roles.includes('Social Media Manager');

            if (verdict === 'approve') {
                if (isSMM || task.reviewStatus === 'Chief Approved') {
                    task.reviewStatus = 'SMM Approved';
                    task.status = 'Completed';
                    alert('Final approval granted by SMM!');
                } else {
                    task.reviewStatus = 'Chief Approved';
                    task.status = 'In Progress';
                    alert('Chief approved! Forwarded to SMM for final approval.');
                }
            } else if (verdict === 'revision') {
                const notes = prompt('Enter revision feedback/notes for the member:');
                if (notes === null) return;
                task.reviewStatus = 'Needs Revision';
                task.status = 'Pending';
                task.revisionNotes = notes;
                alert('Revision requested.');
            }
            await saveAppData();
            render();
        }

        async function addUserRole(userId, newRole) {
            if (!state.currentUser.roles.includes('Social Media Manager')) {
                alert('Permission denied: Only the Social Media Manager can assign roles.'); return;
            }
            const user = state.users.find(u => u.id === userId);
            if (user) {
                if (!user.roles) user.roles = ['Caption Writer'];
                if (user.roles.length >= 2) { alert('Maximum limit reached: A member can have at most 2 roles.'); return; }
                if (user.roles.includes(newRole)) { alert('This member already has this role.'); return; }
                user.roles.push(newRole);
                await saveAppData();
                render();
            }
        }

        async function removeUserRole(userId, roleToRemove) {
            if (!state.currentUser.roles.includes('Social Media Manager')) {
                alert('Permission denied: Only the Social Media Manager can modify roles.'); return;
            }
            const user = state.users.find(u => u.id === userId);
            if (user && user.roles) {
                if (user.roles.length <= 1) { alert('Members must retain at least 1 role.'); return; }
                user.roles = user.roles.filter(r => r !== roleToRemove);
                await saveAppData();
                render();
            }
        }

        async function removeMember(userId) {
            if (!state.currentUser.roles.includes('Social Media Manager')) {
                alert('Permission denied: Only the Social Media Manager can remove members.'); return;
            }

            const pin = prompt('Enter confirmation password (qw) to remove this member:');
            if (pin === null) return;
            if (pin !== 'qw') {
                alert('Incorrect password! Removal canceled.');
                return;
            }

            const targetUser = state.users.find(u => u.id === userId);
            if (targetUser && targetUser.roles && targetUser.roles.includes('Social Media Manager')) {
                alert('Cannot remove the primary Social Media Manager.');
                return;
            }

            state.users = state.users.filter(u => u.id !== userId);
            await saveAppData();
            alert('Member removed successfully.');
            render();
        }

        function changeMonth(direction) {
            state.currentMonth += direction;
            if (state.currentMonth > 11) { state.currentMonth = 0; state.currentYear++; }
            else if (state.currentMonth < 0) { state.currentMonth = 11; state.currentYear--; }
            render();
        }

        function getReminderBadge(deadlineStr) {
            const now = new Date();
            const deadline = new Date(deadlineStr);
            const diffHours = (deadline - now) / (1000 * 60 * 60);
            if (diffHours < 0) return `<span class="badge-red">Overdue</span>`;
            if (diffHours <= 24) return `<span class="badge-amber">24hr Reminder!</span>`;
            if (diffHours <= 48) return `<span class="badge-blue">48hr Notice</span>`;
            return `<span style="background:#1f2937; color:#9ca3af; padding:2px 6px; border-radius:99px; font-size:9px;">Scheduled</span>`;
        }

        function renderCalendar() {
            const firstDay = new Date(state.currentYear, state.currentMonth, 1).getDay();
            const daysInMonth = new Date(state.currentYear, state.currentMonth + 1, 0).getDate();

            let cells = '';
            for (let i = 0; i < firstDay; i++) {
                cells += `<div class="cal-cell" style="opacity: 0.15;"></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${state.currentYear}-${String(state.currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayTasks = state.tasks.filter(t => t.deadline.startsWith(dateStr));

                cells += `
                    <div class="cal-cell">
                        <span class="cal-day-num">${day}</span>
                        <div style="overflow-y:auto; max-height:45px;">
                            ${dayTasks.map(t => `<div style="background:#172554; color:#93c5fd; padding:1px 3px; border-radius:3px; font-size:8px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${t.title} (${t.assignee})"><b>${t.assignee}:</b> ${t.title}</div>`).join('')}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="panel">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <h3 style="font-size:14px; font-weight:bold;">${MONTH_NAMES[state.currentMonth]} ${state.currentYear}</h3>
                        <div>
                            <button onclick="changeMonth(-1)" class="logout-btn">&larr; Prev</button>
                            <button onclick="changeMonth(1)" class="logout-btn">Next &rarr;</button>
                        </div>
                    </div>
                    <div class="calendar-grid cal-header">
                        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                    </div>
                    <div class="calendar-grid">
                        ${cells}
                    </div>
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');
            if (!state.currentUser) {
                const isLogin = state.authTab === 'login';
                app.innerHTML = `
                    <div class="auth-container">
                        <div class="card">
                            <h1>LazuWrite</h1>
                            <p class="subtitle">Team Coordination & Workflow Hub</p>
                            <div class="tabs">
                                <button onclick="switchTab('login')" class="tab-btn ${isLogin ? 'active' : ''}">Sign In</button>
                                <button onclick="switchTab('register')" class="tab-btn ${!isLogin ? 'active' : ''}">Register</button>
                            </div>
                            ${isLogin ? `
                                <form onsubmit="handleLogin(event)">
                                    <div class="form-group"><label>Username</label><input type="text" id="login-username" required placeholder="Enter username"></div>
                                    <div class="form-group"><label>Password</label><input type="password" id="login-password" required placeholder="Enter password"></div>
                                    <button type="submit" class="submit-btn">Sign In</button>
                                </form>
                            ` : `
                                <form onsubmit="handleRegister(event)">
                                    <div class="form-group"><label>Choose Username</label><input type="text" id="reg-username" required placeholder="Choose username"></div>
                                    <div class="form-group"><label>Create Password</label><input type="password" id="reg-password" required placeholder="Create password"></div>
                                    <button type="submit" class="submit-btn" style="background:#4f46e5;">Create Account</button>
                                </form>
                            `}
                        </div>
                    </div>
                `;
            } else {
                const isSMM = state.currentUser.roles && state.currentUser.roles.includes('Social Media Manager');
                const isChiefCaptionWriter = state.currentUser.roles && state.currentUser.roles.includes('Chief Caption Writer');
                const isChiefPubMatArtist = state.currentUser.roles && state.currentUser.roles.includes('Chief PubMat Artist');
                const isChiefTextFormatter = state.currentUser.roles && state.currentUser.roles.includes('Chief Text Formatter');
                const isTextFormatter = state.currentUser.roles && state.currentUser.roles.some(r => r.includes('Text Formatter'));
                const isPubMatArtist = state.currentUser.roles && state.currentUser.roles.some(r => r.includes('PubMat Artist'));
                const editingTask = state.editingTaskId ? state.tasks.find(t => t.id === state.editingTaskId) : null;

                app.className = "dashboard";
                app.innerHTML = `
                    <header>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <h1 style="font-size:17px; margin:0;">LazuWrite</h1>
                            <span style="background:#172554; color:#93c5fd; border:1px solid #1e40af; font-size:10px; padding:2px 6px; border-radius:99px;">${(state.currentUser.roles || []).join(', ')}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
                            <span style="font-size:12px; color:#d1d5db;">Hello, <b>${state.currentUser.username}</b></span>
                            <div class="nav-links">
                                <button onclick="setView('dashboard')" class="nav-link ${state.currentView === 'dashboard' ? 'active' : ''}">Dashboard</button>
                                ${isSMM ? `<button onclick="setView('settings')" class="nav-link ${state.currentView === 'settings' ? 'active' : ''}">Settings</button>` : ''}
                            </div>
                            <button onclick="handleLogout()" class="logout-btn">Sign Out</button>
                        </div>
                    </header>

                    ${state.currentView === 'settings' && isSMM ? `
                        <div class="panel" style="max-width: 600px; margin: 0 auto; width: 100%;">
                            <h2>Settings & Member Management</h2>
                            <p style="font-size: 11px; color: #9ca3af; margin-bottom: 14px;">Manage and remove team members securely using password confirmation.</p>
                            <div style="display:flex; flex-direction:column; gap:8px;">
                                ${state.users.map(u => `
                                    <div style="background:#030712; border:1px solid #1f2937; padding:12px; border-radius:8px; display:flex; justify-content:space-between; align-items:center;">
                                        <div>
                                            <span style="font-weight:600; font-size:13px; color:#f3f4f6;">${u.username}</span>
                                            <div style="font-size:10px; color:#9ca3af; margin-top:2px;">Roles: ${(u.roles || []).join(', ')}</div>
                                        </div>
                                        ${!u.roles.includes('Social Media Manager') ? `
                                            <button onclick="removeMember(${u.id})" class="action-btn del" style="padding:6px 10px;">Remove Member</button>
                                        ` : `<span style="font-size:10px; color:#60a5fa; font-style:italic;">Primary SMM</span>`}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : `
                        <main class="grid">
                            <div style="display:flex; flex-direction:column; gap:16px;">
                                <!-- SMM-Only Deadline & Task Form -->
                                ${isSMM ? `
                                    <div class="panel" style="${editingTask ? 'border-color: #2563eb;' : ''}">
                                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
                                            <h2 style="margin:0;">${editingTask ? 'Edit Task Deadline' : 'Set Task Deadline & Instructions'}</h2>
                                            ${editingTask ? `<button onclick="cancelEdit()" class="logout-btn" style="background:#7f1d1d; color:#fca5a5;">Cancel Edit</button>` : ''}
                                        </div>
                                        <form onsubmit="handleTaskSubmit(event)" style="display:flex; flex-direction:column; gap:10px;">
                                            <div>
                                                <label>Task Title / Topic</label>
                                                <input type="text" id="task-title" required value="${editingTask ? editingTask.title : ''}" placeholder="e.g. FB Promo Campaign">
                                            </div>
                                            <div>
                                                <label>Task Type</label>
                                                <select id="task-type">
                                                    <option value="Make Pubmat" ${editingTask && editingTask.taskType === 'Make Pubmat' ? 'selected' : ''}>Make Pubmat (Chief PubMat Artist)</option>
                                                    <option value="Make Caption" ${editingTask && editingTask.taskType === 'Make Caption' ? 'selected' : ''}>Make Caption (Chief Caption Writer)</option>
                                                    <option value="Edit caption" ${editingTask && editingTask.taskType === 'Edit caption' ? 'selected' : ''}>Edit caption (Chief Text Formatter)</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label>Specific Instructions / Details</label>
                                                <textarea id="task-instructions" rows="2" placeholder="Provide detailed instructions for this task...">${editingTask ? (editingTask.instructions || '') : ''}</textarea>
                                            </div>
                                            <div>
                                                <label>Deadline</label>
                                                <input type="datetime-local" id="task-deadline" required value="${editingTask ? editingTask.deadline : ''}">
                                            </div>
                                            <button type="submit" class="submit-btn" style="${editingTask ? 'background:#059669;' : ''}">${editingTask ? 'Save Changes' : 'Set Deadline & Publish'}</button>
                                        </form>
                                    </div>
                                ` : ''}

                                <!-- Tasks List & Workflows -->
                                <div class="panel">
                                    <h2>Active Team Tasks & Deadlines</h2>
                                    <div style="display:flex; flex-direction:column; gap:12px;">
                                        ${state.tasks.length === 0 ? `<p style="color:#6b7280; font-size:11px;">No deadlines set yet.</p>` : ''}
                                        ${state.tasks.map(t => {
                                            const isAssignedToMe = t.assignee === state.currentUser.username;
                                            const isUnassigned = t.assignee === 'Unassigned';
                                            const isMakeCaption = t.taskType === 'Make Caption';
                                            const isEditCaption = t.taskType === 'Edit caption';
                                            const isMakePubmat = t.taskType === 'Make Pubmat';

                                            const canAssign = (isChiefCaptionWriter && isMakeCaption) || 
                                                              (isChiefPubMatArtist && isMakePubmat) || 
                                                              (isChiefTextFormatter && isEditCaption);

                                            let reviewBadge = '';
                                            if (t.reviewStatus === 'SMM Approved') {
                                                reviewBadge = `<span class="badge-status-approved">SMM Approved</span>`;
                                            } else if (t.reviewStatus === 'Chief Approved') {
                                                reviewBadge = `<span class="badge-status-smm">Chief Approved (Pending SMM)</span>`;
                                            } else if (t.reviewStatus === 'Needs Revision') {
                                                reviewBadge = `<span class="badge-status-revision">Needs Revision</span>`;
                                            } else if (t.reviewStatus === 'Pending Review') {
                                                reviewBadge = `<span style="background:#1f2937; color:#9ca3af; padding:2px 6px; border-radius:99px; font-size:9px;">Pending Review</span>`;
                                            } else {
                                                reviewBadge = `<span class="badge-amber">Needs Assignment</span>`;
                                            }

                                            return `
                                                <div style="background:#030712; border:1px solid #1f2937; padding:12px; border-radius:8px; display:flex; flex-direction:column; gap:8px;">
                                                    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px; flex-wrap:wrap;">
                                                        <div style="flex: 1; min-width: 180px;">
                                                            <div style="display:flex; align-items:center; gap:6px; margin-bottom:4px; flex-wrap:wrap;">
                                                                <span style="font-weight:600; font-size:13px;">${t.title}</span>
                                                                <span class="badge-type">${t.taskType || 'Task'}</span>
                                                                ${reviewBadge}
                                                                ${getReminderBadge(t.deadline)}
                                                            </div>
                                                            ${t.instructions ? `<div style="font-size:11px; color:#d1d5db; background:#111827; padding:6px; border-radius:6px; margin-bottom:4px; border-left:2px solid #3b82f6;"><b>Instructions:</b> ${t.instructions}</div>` : ''}
                                                            ${t.revisionNotes ? `<div style="font-size:11px; color:#fb923c; background:#451a03; padding:6px; border-radius:6px; margin-bottom:4px; border-left:2px solid #f97316;"><b>Revision Requested:</b> ${t.revisionNotes}</div>` : ''}
                                                            <span style="font-size:10px; color:#9ca3af;">Assigned to: <b style="color:#60a5fa">${t.assignee}</b> &bull; Due: ${new Date(t.deadline).toLocaleString()}</span>
                                                        </div>
                                                        <div style="display:flex; align-items:center; gap:6px;">
                                                            <select onchange="updateTaskStatus(${t.id}, this.value)" style="width:auto; padding:5px; font-size:11px;">
                                                                <option value="Pending" ${t.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                                                <option value="In Progress" ${t.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                                                                <option value="Completed" ${t.status === 'Completed' ? 'selected' : ''}>Completed</option>
                                                            </select>
                                                            ${isSMM ? `
                                                                <button onclick="startEditTask(${t.id})" class="action-btn">Edit</button>
                                                                <button onclick="deleteTask(${t.id})" class="action-btn del">Delete</button>
                                                            ` : ''}
                                                        </div>
                                                    </div>

                                                    <!-- Chief Assignment Section -->
                                                    ${isUnassigned && canAssign ? `
                                                        <div style="background:#111827; border:1px solid #1f2937; padding:8px; border-radius:6px; margin-top:4px; display:flex; gap:6px; align-items:center;">
                                                            <select id="assignee-select-${t.id}" style="font-size:11px;">
                                                                ${state.users.map(u => `<option value="${u.username}">${u.username} (${(u.roles || []).join(', ')})</option>`).join('')}
                                                            </select>
                                                            <button onclick="assignTaskMember(${t.id})" class="action-btn" style="background:#2563eb; color:#fff; padding:6px 12px; white-space:nowrap;">Assign Member / Self</button>
                                                        </div>
                                                    ` : ''}

                                                    <!-- Submission Area for Assigned User -->
                                                    ${isAssignedToMe && !isUnassigned ? `
                                                        <div style="background:#111827; border:1px solid #1f2937; padding:8px; border-radius:6px; margin-top:4px;">
                                                            <label style="margin-bottom:4px; color:#60a5fa;">Your Submission:</label>
                                                            ${isMakePubmat && isPubMatArtist ? `
                                                                <div style="font-size:11px; color:#d1d5db; margin-bottom:6px;">
                                                                    As a PubMat Artist, please open the <a href="https://drive.google.com/drive/folders/1LUc27TF7zExN6MyLOVJw8ZSG_Q4b7Gwu" target="_blank" style="color:#60a5fa; text-decoration:underline;">Google Drive Folder</a> to upload your photo, then paste your submission notes below:
                                                                </div>
                                                            ` : ''}
                                                            <textarea id="sub-text-${t.id}" rows="2" placeholder="Type your text submission or link here..." style="margin-bottom:6px;">${t.submission || ''}</textarea>
                                                            <button onclick="submitTaskWork(${t.id})" class="action-btn" style="background:#2563eb; color:#fff; padding:6px 12px;">Submit Work for Review</button>
                                                        </div>
                                                    ` : t.submission ? `
                                                        <div style="font-size:10px; color:#9ca3af; background:#111827; padding:6px; border-radius:4px;">
                                                            <b>Submission by ${t.assignee}:</b> ${t.submission}
                                                        </div>
                                                    ` : ''}

                                                    <!-- Chief Review Controls -->
                                                    ${((isMakeCaption && isChiefCaptionWriter) || (isMakePubmat && isChiefPubMatArtist) || (isEditCaption && isChiefTextFormatter)) && t.submission && t.reviewStatus === 'Pending Review' ? `
                                                        <div style="background:#1e1b4b; border:1px solid #312e81; padding:8px; border-radius:6px; display:flex; align-items:center; justify-content:space-between; gap:8px;">
                                                            <span style="font-size:11px; color:#c7d2fe;"><b>Chief Review:</b> Check submission and approve or ask for revision.</span>
                                                            <div style="display:flex; gap:6px;">
                                                                <button onclick="reviewTask(${t.id}, 'approve')" class="action-btn approve">Approve & Send to SMM</button>
                                                                <button onclick="reviewTask(${t.id}, 'revision')" class="action-btn revision">Ask Revision</button>
                                                            </div>
                                                        </div>
                                                    ` : ''}

                                                    <!-- SMM Final Review Controls -->
                                                    ${isSMM && t.submission && t.reviewStatus === 'Chief Approved' ? `
                                                        <div style="background:#172554; border:1px solid #1e40af; padding:8px; border-radius:6px; display:flex; align-items:center; justify-content:space-between; gap:8px;">
                                                            <span style="font-size:11px; color:#93c5fd;"><b>SMM Final Review:</b> Give final approval or request revisions.</span>
                                                            <div style="display:flex; gap:6px;">
                                                                <button onclick="reviewTask(${t.id}, 'approve')" class="action-btn approve">Final Approve</button>
                                                                <button onclick="reviewTask(${t.id}, 'revision')" class="action-btn revision">Ask Revision</button>
                                                            </div>
                                                        </div>
                                                    ` : ''}
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                </div>

                                <!-- Month Calendar View -->
                                ${renderCalendar()}
                            </div>

                            <!-- Right Column: SMM-Only Roster & Multi-Role Manager -->
                            <div>
                                ${isSMM ? `
                                    <div class="panel">
                                        <h2>Team Members Roster</h2>
                                        <div style="display:flex; flex-direction:column; gap:8px;">
                                            ${state.users.map(u => `
                                                <div class="roster-item">
                                                    <div style="display:flex; justify-content:space-between; align-items:center;">
                                                        <span style="font-weight:600; font-size:12px;">${u.username}</span>
                                                    </div>
                                                    <div style="display:flex; flex-wrap:wrap; gap:4px;">
                                                        ${(u.roles || []).map(r => `
                                                            <span class="role-tag">
                                                                ${r}
                                                                ${u.roles.length > 1 ? `<button onclick="removeUserRole(${u.id}, '${r}')">&times;</button>` : ''}
                                                            </span>
                                                        `).join('')}
                                                    </div>
                                                    ${(u.roles || []).length < 2 ? `
                                                        <div style="display:flex; gap:6px; margin-top:2px;">
                                                            <select id="add-role-${u.id}" style="padding:4px; font-size:10px;">
                                                                <option value="">+ Add second role...</option>
                                                                ${ROLES.filter(r => !(u.roles || []).includes(r)).map(r => `<option value="${r}">${r}</option>`).join('')}
                                                            </select>
                                                            <button onclick="const sel = document.getElementById('add-role-${u.id}'); if(sel.value) addUserRole(${u.id}, sel.value);" style="background:#2563eb; color:#fff; border:none; padding:4px 8px; border-radius:4px; font-size:10px; cursor:pointer;">Add</button>
                                                        </div>
                                                    ` : `<span style="font-size:9px; color:#6b7280; font-style:italic;">Max 2 roles reached</span>`}
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : `
                                    <div class="panel" style="text-align:center;">
                                        <h2>Workspace Access</h2>
                                        <p style="font-size:11px; color:#9ca3af;">Member directory and role administration are strictly restricted to the Social Media Manager.</p>
                                    </div>
                                `}
                            </div>
                        </main>
                    `}
                `;
            }
        }

        init();
    </script>
</body>
</html>

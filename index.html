<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LazuWrite - Team Coordination</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-3 sm:p-6">

    <div id="app" class="w-full max-w-md flex flex-col items-center justify-center"></div>

    <script>
        let state = {
            currentUser: null,
            users: JSON.parse(localStorage.getItem('lazu_users') || '[]'),
            authTab: 'login'
        };

        const ROLES = [
            'Social Media Manager',
            'Chief Caption Writer',
            'Chief PubMat Artist',
            'Chief Text Formatter',
            'Caption Writer',
            'PubMat Artist',
            'Text Formatter'
        ];

        function init() {
            const saved = sessionStorage.getItem('lazu_session');
            if (saved) state.currentUser = JSON.parse(saved);
            render();
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            const user = state.users.find(u => u.username.toLowerCase() === username.toLowerCase());
            if (!user) {
                alert('Username not found! Please register first.');
                return;
            }
            if (user.password !== password) {
                alert('Incorrect password!');
                return;
            }

            state.currentUser = user;
            sessionStorage.setItem('lazu_session', JSON.stringify(user));
            render();
        }

        function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value;

            if (state.users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
                alert('Username already exists!');
                return;
            }

            const isFirst = state.users.length === 0;
            const newUser = {
                id: Date.now(),
                username,
                password,
                role: isFirst ? 'Social Media Manager' : 'Caption Writer'
            };

            state.users.push(newUser);
            localStorage.setItem('lazu_users', JSON.stringify(state.users));

            state.currentUser = newUser;
            sessionStorage.setItem('lazu_session', JSON.stringify(newUser));
            render();
        }

        function handleLogout() {
            state.currentUser = null;
            sessionStorage.removeItem('lazu_session');
            render();
        }

        function switchTab(tab) {
            state.authTab = tab;
            render();
        }

        function render() {
            const app = document.getElementById('app');
            if (!state.currentUser) {
                const isLogin = state.authTab === 'login';
                app.className = "w-full max-w-sm sm:max-w-md flex flex-col items-center justify-center";
                app.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl w-full">
                        <div class="text-center mb-6">
                            <h1 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">LazuWrite</h1>
                            <p class="text-slate-400 text-xs sm:text-sm mt-1">Team Coordination & Workflow Hub</p>
                        </div>
                        <div class="flex bg-slate-950 p-1 rounded-xl mb-6 border border-slate-800">
                            <button onclick="switchTab('login')" class="flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg transition ${isLogin ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}">Sign In</button>
                            <button onclick="switchTab('register')" class="flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg transition ${!isLogin ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}">Register</button>
                        </div>
                        ${isLogin ? `
                            <form onsubmit="handleLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-[11px] sm:text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Username</label>
                                    <input type="text" id="login-username" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 sm:px-4 py-2.5 sm:py-3 text-sm text-slate-100 focus:outline-none focus:border-blue-500" placeholder="Enter username">
                                </div>
                                <div>
                                    <label class="block text-[11px] sm:text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
                                    <input type="password" id="login-password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 sm:px-4 py-2.5 sm:py-3 text-sm text-slate-100 focus:outline-none focus:border-blue-500" placeholder="Enter password">
                                </div>
                                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold py-3 rounded-lg transition shadow-lg shadow-blue-600/20">Sign In</button>
                            </form>
                        ` : `
                            <form onsubmit="handleRegister(event)" class="space-y-4">
                                <div>
                                    <label class="block text-[11px] sm:text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Choose Username</label>
                                    <input type="text" id="reg-username" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 sm:px-4 py-2.5 sm:py-3 text-sm text-slate-100 focus:outline-none focus:border-blue-500" placeholder="Choose username">
                                </div>
                                <div>
                                    <label class="block text-[11px] sm:text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Create Password</label>
                                    <input type="password" id="reg-password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 sm:px-4 py-2.5 sm:py-3 text-sm text-slate-100 focus:outline-none focus:border-blue-500" placeholder="Create password">
                                </div>
                                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold py-3 rounded-lg transition shadow-lg shadow-indigo-600/20">Create Account</button>
                            </form>
                        `}
                    </div>
                `;
                document.body.className = "bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-3 sm:p-6";
            } else {
                const isSMM = state.currentUser.role === 'Social Media Manager';
                app.className = "w-full flex-1 flex flex-col max-w-7xl mx-auto";
                app.innerHTML = `
                    <header class="bg-slate-900 border-b border-slate-800 px-4 sm:px-6 py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 w-full rounded-2xl sm:rounded-none mb-4 sm:mb-0">
                        <div class="flex items-center space-x-3">
                            <h1 class="text-lg sm:text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">LazuWrite</h1>
                            <span class="text-[10px] sm:text-xs bg-blue-950 text-blue-400 border border-blue-800 px-2.5 py-0.5 rounded-full font-medium">${state.currentUser.role}</span>
                        </div>
                        <div class="flex items-center justify-between w-full sm:w-auto space-x-4">
                            <span class="text-xs sm:text-sm text-slate-300">Hello, <b>${state.currentUser.username}</b></span>
                            <button onclick="handleLogout()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs sm:text-sm px-3 py-1.5 rounded-lg transition">Sign Out</button>
                        </div>
                    </header>
                    <main class="flex-1 p-2 sm:p-6 w-full grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6">
                        <div class="md:col-span-2 space-y-4 sm:space-y-6">
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl">
                                <h2 class="text-base sm:text-lg font-bold text-slate-200 mb-2">Team Workflow & Content Board</h2>
                                <p class="text-xs sm:text-sm text-slate-400">Workspace active and scaled for your screen.</p>
                            </div>
                        </div>
                        <div class="space-y-4 sm:space-y-6">
                            ${isSMM ? `
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl">
                                    <h2 class="text-base sm:text-lg font-bold text-slate-200 mb-4">Team Members Roster</h2>
                                    <div class="space-y-3">
                                        ${state.users.map(u => `
                                            <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl flex justify-between items-center">
                                                <div>
                                                    <p class="font-semibold text-slate-200 text-xs sm:text-sm">${u.username}</p>
                                                    <p class="text-[11px] text-blue-400">${u.role}</p>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            ` : `
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl text-center">
                                    <h2 class="text-base sm:text-lg font-bold text-slate-200 mb-2">Workspace Access</h2>
                                    <p class="text-xs text-slate-400">Member directory restricted to Social Media Manager.</p>
                                </div>
                            `}
                        </div>
                    </main>
                `;
                document.body.className = "bg-slate-950 text-slate-100 min-h-screen flex flex-col p-0 sm:p-4";
            }
        }

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LazuWrite - Team Coordination & Calendar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col p-3 sm:p-6">

    <div id="app" class="w-full flex-1 flex flex-col items-center justify-center"></div>

    <script>
        let state = {
            currentUser: null,
            users: JSON.parse(localStorage.getItem('lazu_users') || '[]'),
            tasks: JSON.parse(localStorage.getItem('lazu_tasks') || '[]'),
            authTab: 'login',
            currentMonth: new Date().getMonth(),
            currentYear: new Date().getFullYear()
        };

        const ROLES = [
            'Social Media Manager',
            'Chief Caption Writer',
            'Chief PubMat Artist',
            'Chief Text Formatter',
            'Caption Writer',
            'PubMat Artist',
            'Text Formatter'
        ];

        const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        function init() {
            const saved = sessionStorage.getItem('lazu_session');
            if (saved) {
                state.currentUser = JSON.parse(saved);
                // Sync latest user profile state if updated by SMM
                const upToDateUser = state.users.find(u => u.username === state.currentUser.username);
                if (upToDateUser) {
                    state.currentUser = upToDateUser;
                    sessionStorage.setItem('lazu_session', JSON.stringify(upToDateUser));
                }
            }
            render();
            setInterval(render, 60000); 
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            const user = state.users.find(u => u.username.toLowerCase() === username.toLowerCase());
            if (!user) {
                alert('Username not found! Please register first.');
                return;
            }
            if (user.password !== password) {
                alert('Incorrect password!');
                return;
            }

            state.currentUser = user;
            sessionStorage.setItem('lazu_session', JSON.stringify(user));
            render();
        }

        function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value;

            if (state.users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
                alert('Username already exists!');
                return;
            }

            const isFirst = state.users.length === 0;
            const newUser = {
                id: Date.now(),
                username,
                password,
                role: isFirst ? 'Social Media Manager' : 'Caption Writer'
            };

            state.users.push(newUser);
            localStorage.setItem('lazu_users', JSON.stringify(state.users));

            state.currentUser = newUser;
            sessionStorage.setItem('lazu_session', JSON.stringify(newUser));
            render();
        }

        function handleLogout() {
            state.currentUser = null;
            sessionStorage.removeItem('lazu_session');
            render();
        }

        function switchTab(tab) {
            state.authTab = tab;
            render();
        }

        function handleAddTask(e) {
            e.preventDefault();
            const title = document.getElementById('task-title').value.trim();
            const assignee = document.getElementById('task-assignee').value;
            const deadline = document.getElementById('task-deadline').value;

            if (!title || !deadline) return;

            const newTask = {
                id: Date.now(),
                title,
                assignee,
                deadline,
                status: 'Pending'
            };

            state.tasks.push(newTask);
            localStorage.setItem('lazu_tasks', JSON.stringify(state.tasks));
            render();
        }

        function updateTaskStatus(taskId, status) {
            const task = state.tasks.find(t => t.id === taskId);
            if (task) {
                task.status = status;
                localStorage.setItem('lazu_tasks', JSON.stringify(state.tasks));
                render();
            }
        }

        function updateUserRole(userId, newRole) {
            // Strict security check: Only SMM can update roles
            if (state.currentUser.role !== 'Social Media Manager') {
                alert('Permission denied: Only the Social Media Manager can change roles.');
                return;
            }

            const user = state.users.find(u => u.id === userId);
            if (user) {
                user.role = newRole;
                localStorage.setItem('lazu_users', JSON.stringify(state.users));
                
                // If SMM updated themselves, update active session
                if (user.username === state.currentUser.username) {
                    state.currentUser = user;
                    sessionStorage.setItem('lazu_session', JSON.stringify(user));
                }
                render();
            }
        }

        function changeMonth(direction) {
            state.currentMonth += direction;
            if (state.currentMonth > 11) {
                state.currentMonth = 0;
                state.currentYear++;
            } else if (state.currentMonth < 0) {
                state.currentMonth = 11;
                state.currentYear--;
            }
            render();
        }

        function getReminderBadge(deadlineStr) {
            const now = new Date();
            const deadline = new Date(deadlineStr);
            const diffHours = (deadline - now) / (1000 * 60 * 60);

            if (diffHours < 0) return `<span class="bg-red-950 text-red-400 border border-red-800 text-[10px] px-2 py-0.5 rounded-full font-medium">Overdue</span>`;
            if (diffHours <= 24) return `<span class="bg-amber-950 text-amber-400 border border-amber-800 text-[10px] px-2 py-0.5 rounded-full font-medium animate-pulse">24hr Reminder!</span>`;
            if (diffHours <= 48) return `<span class="bg-blue-950 text-blue-400 border border-blue-800 text-[10px] px-2 py-0.5 rounded-full font-medium">48hr Notice</span>`;
            return `<span class="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded-full font-medium">Scheduled</span>`;
        }

        function renderCalendar() {
            const firstDay = new Date(state.currentYear, state.currentMonth, 1).getDay();
            const daysInMonth = new Date(state.currentYear, state.currentMonth + 1, 0).getDate();

            let cells = '';
            for (let i = 0; i < firstDay; i++) {
                cells += `<div class="bg-slate-950/40 rounded-lg p-2 min-h-[70px] opacity-20"></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${state.currentYear}-${String(state.currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayTasks = state.tasks.filter(t => t.deadline.startsWith(dateStr));

                cells += `
                    <div class="bg-slate-950 border border-slate-800/80 rounded-lg p-2 min-h-[80px] flex flex-col justify-between">
                        <span class="text-xs font-bold text-slate-400">${day}</span>
                        <div class="space-y-1 overflow-y-auto max-h-[60px]">
                            ${dayTasks.map(t => `
                                <div class="bg-blue-950/60 border border-blue-800/50 rounded px-1.5 py-0.5 text-[10px] text-blue-200 truncate" title="${t.title} (${t.assignee})">
                                    <b>${t.assignee}:</b> ${t.title}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl w-full">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-base sm:text-lg font-bold text-slate-200">${MONTH_NAMES[state.currentMonth]} ${state.currentYear}</h3>
                        <div class="space-x-2">
                            <button onclick="changeMonth(-1)" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg transition">&larr; Prev</button>
                            <button onclick="changeMonth(1)" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg transition">Next &rarr;</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-semibold text-slate-500 mb-2">
                        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                    </div>
                    <div class="grid grid-cols-7 gap-1.5">
                        ${cells}
                    </div>
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');
            if (!state.currentUser) {
                const isLogin = state.authTab === 'login';
                app.className = "w-full max-w-sm sm:max-w-md flex flex-col items-center justify-center";
                app.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl w-full">
                        <div class="text-center mb-6">
                            <h1 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">LazuWrite</h1>
                            <p class="text-slate-400 text-xs sm:text-sm mt-1">Team Coordination & Workflow Hub</p>
                        </div>
                        <div class="flex bg-slate-950 p-1 rounded-xl mb-6 border border-slate-800">
                            <button onclick="switchTab('login')" class="flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg transition ${isLogin ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}">Sign In</button>
                            <button onclick="switchTab('register')" class="flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg transition ${!isLogin ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}">Register</button>
                        </div>
                        ${isLogin ? `
                            <form onsubmit="handleLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-[11px] sm:text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Username</label>
                                    <input type="text" id="login-username" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 sm:px-4 py-2.5 sm:py-3 text-sm text-slate-100 focus:outline-none focus:border-blue-500" placeholder="Enter username">
                                </div>
                                <div>
                                    <label class="block text-[11px] sm:text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
                                    <input type="password" id="login-password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 sm:px-4 py-2.5 sm:py-3 text-sm text-slate-100 focus:outline-none focus:border-blue-500" placeholder="Enter password">
                                </div>
                                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold py-3 rounded-lg transition shadow-lg shadow-blue-600/20">Sign In</button>
                            </form>
                        ` : `
                            <form onsubmit="handleRegister(event)" class="space-y-4">
                                <div>
                                    <label class="block text-[11px] sm:text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Choose Username</label>
                                    <input type="text" id="reg-username" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 sm:px-4 py-2.5 sm:py-3 text-sm text-slate-100 focus:outline-none focus:border-blue-500" placeholder="Choose username">
                                </div>
                                <div>
                                    <label class="block text-[11px] sm:text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Create Password</label>
                                    <input type="password" id="reg-password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 sm:px-4 py-2.5 sm:py-3 text-sm text-slate-100 focus:outline-none focus:border-blue-500" placeholder="Create password">
                                </div>
                                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold py-3 rounded-lg transition shadow-lg shadow-indigo-600/20">Create Account</button>
                            </form>
                        `}
                    </div>
                `;
                document.body.className = "bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-3 sm:p-6";
            } else {
                const isSMM = state.currentUser.role === 'Social Media Manager';
                app.className = "w-full flex-1 flex flex-col max-w-7xl mx-auto";
                app.innerHTML = `
                    <header class="bg-slate-900 border-b border-slate-800 px-4 sm:px-6 py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 w-full rounded-2xl mb-4">
                        <div class="flex items-center space-x-3">
                            <h1 class="text-lg sm:text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">LazuWrite</h1>
                            <span class="text-[10px] sm:text-xs bg-blue-950 text-blue-400 border border-blue-800 px-2.5 py-0.5 rounded-full font-medium">${state.currentUser.role}</span>
                        </div>
                        <div class="flex items-center justify-between w-full sm:w-auto space-x-4">
                            <span class="text-xs sm:text-sm text-slate-300">Hello, <b>${state.currentUser.username}</b></span>
                            <button onclick="handleLogout()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs sm:text-sm px-3 py-1.5 rounded-lg transition">Sign Out</button>
                        </div>
                    </header>
                    <main class="flex-1 w-full grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6">
                        <div class="md:col-span-2 space-y-4 sm:space-y-6">
                            <!-- Task Assignment Form -->
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl">
                                <h2 class="text-base sm:text-lg font-bold text-slate-200 mb-4">Assign Task & Set Deadline</h2>
                                <form onsubmit="handleAddTask(event)" class="space-y-3">
                                    <div>
                                        <input type="text" id="task-title" required placeholder="Task description (e.g., Publish FB Promo PubMat)" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs sm:text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                                    </div>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <select id="task-assignee" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs sm:text-sm text-slate-300 focus:outline-none focus:border-blue-500">
                                            ${state.users.map(u => `<option value="${u.username}">${u.username} (${u.role})</option>`).join('')}
                                        </select>
                                        <input type="datetime-local" id="task-deadline" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs sm:text-sm text-slate-300 focus:outline-none focus:border-blue-500">
                                    </div>
                                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs sm:text-sm font-semibold py-2.5 rounded-lg transition">Publish & Assign Task</button>
                                </form>
                            </div>

                            <!-- Tasks List & Reminders -->
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl">
                                <h2 class="text-base sm:text-lg font-bold text-slate-200 mb-4">Active Team Tasks & Deadlines</h2>
                                <div class="space-y-3">
                                    ${state.tasks.length === 0 ? `<p class="text-xs text-slate-500">No tasks assigned yet.</p>` : ''}
                                    ${state.tasks.map(t => `
                                        <div class="bg-slate-950 border border-slate-800 p-3.5 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                            <div class="space-y-1">
                                                <div class="flex items-center space-x-2">
                                                    <p class="font-semibold text-slate-200 text-xs sm:text-sm">${t.title}</p>
                                                    ${getReminderBadge(t.deadline)}
                                                </div>
                                                <p class="text-[11px] text-slate-400">Assigned to: <b class="text-blue-400">${t.assignee}</b> &bull; Due: ${new Date(t.deadline).toLocaleString()}</p>
                                            </div>
                                            <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                                                <select onchange="updateTaskStatus(${t.id}, this.value)" class="bg-slate-900 border border-slate-800 text-xs text-slate-300 rounded p-1.5">
                                                    <option value="Pending" ${t.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                                    <option value="In Progress" ${t.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                                                    <option value="Completed" ${t.status === 'Completed' ? 'selected' : ''}>Completed</option>
                                                </select>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- Month Calendar View -->
                            ${renderCalendar()}
                        </div>

                        <!-- Right Column: SMM-Only Team Members Roster & Role Manager -->
                        <div class="space-y-4 sm:space-y-6">
                            ${isSMM ? `
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl">
                                    <h2 class="text-base sm:text-lg font-bold text-slate-200 mb-4">Team Members Roster</h2>
                                    <div class="space-y-3">
                                        ${state.users.map(u => `
                                            <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl space-y-2">
                                                <div class="flex justify-between items-center">
                                                    <p class="font-semibold text-slate-200 text-xs sm:text-sm">${u.username}</p>
                                                    <span class="text-[10px] text-blue-400 font-medium">${u.role}</span>
                                                </div>
                                                <select onchange="updateUserRole(${u.id}, this.value)" class="w-full bg-slate-900 border border-slate-800 text-xs text-slate-300 rounded p-1.5">
                                                    ${ROLES.map(r => `<option value="${r}" ${u.role === r ? 'selected' : ''}>${r}</option>`).join('')}
                                                </select>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            ` : `
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl text-center">
                                    <h2 class="text-base sm:text-lg font-bold text-slate-200 mb-2">Workspace Access</h2>
                                    <p class="text-xs text-slate-400">Member directory and role administration are strictly restricted to the Social Media Manager.</p>
                                </div>
                            `}
                        </div>
                    </main>
                `;
                document.body.className = "bg-slate-950 text-slate-100 min-h-screen flex flex-col p-3 sm:p-6";
            }
        }

        init();
    </script>
</body>
</html>

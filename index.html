<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>LazuWrite - Team Coordination</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, sans-serif; }
        body { background-color: #030712; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
        .card { background-color: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        h1 { font-size: 26px; font-weight: bold; text-align: center; background: linear-gradient(to right, #60a5fa, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
        p.subtitle { text-align: center; color: #9ca3af; font-size: 13px; margin-bottom: 20px; }
        .tabs { display: flex; background: #030712; padding: 4px; border-radius: 10px; border: 1px solid #1f2937; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; font-size: 13px; font-weight: 600; border: none; background: transparent; color: #9ca3af; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .tab-btn.active { background: #2563eb; color: #ffffff; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #9ca3af; margin-bottom: 6px; }
        input, select { width: 100%; background: #030712; border: 1px solid #1f2937; border-radius: 8px; padding: 12px; color: #f3f4f6; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #3b82f6; }
        button.submit-btn { width: 100%; background: #2563eb; color: #ffffff; font-weight: 600; padding: 12px; border: none; border-radius: 8px; cursor: pointer; margin-top: 6px; font-size: 14px; }
        button.submit-btn:hover { background: #1d4ed8; }
        .dashboard { width: 100%; max-width: 1200px; flex: 1; display: flex; flex-direction: column; }
        header { background: #111827; border: 1px solid #1f2937; padding: 16px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logout-btn { background: #1f2937; color: #d1d5db; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; }
        .logout-btn:hover { background: #374151; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 768px) { .grid { grid-template-columns: 2fr 1fr; } }
        .panel { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .panel h2 { font-size: 16px; font-weight: bold; margin-bottom: 14px; color: #e5e7eb; }
        .roster-item { background: #030712; border: 1px solid #1f2937; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .role-tag { display: inline-flex; align-items: center; background: #1f2937; color: #d1d5db; font-size: 11px; padding: 3px 8px; border-radius: 4px; margin-right: 4px; }
        .role-tag button { background: none; border: none; color: #f87171; font-weight: bold; margin-left: 6px; cursor: pointer; font-size: 13px; }
        .badge-red { background: #450a0a; color: #f87171; border: 1px solid #7f1d1d; padding: 2px 8px; border-radius: 99px; font-size: 10px; }
        .badge-amber { background: #451a03; color: #fbbf24; border: 1px solid #78350f; padding: 2px 8px; border-radius: 99px; font-size: 10px; }
        .badge-blue { background: #172554; color: #93c5fd; border: 1px solid #1e40af; padding: 2px 8px; border-radius: 99px; font-size: 10px; }
